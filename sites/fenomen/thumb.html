<!DOCTYPE html>
<html lang="ru">
	<head>
		<title>Феномен</title>
		<meta charset="utf-8">
		<meta name="format-detection" content="telephone=no">
		<link rel="icon" href="/favicon.ico" type="image/x-icon">
		<link rel="stylesheet" href="./fonts/stylesheet.css" />
		<link rel="stylesheet" href="./css/swiper-bundle.min.css" />
		<link rel="stylesheet" href="./css/style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
	</head>
	<body>		
		<div class="wrapper">
			<main class="page">
				<section class="page__thumb thumb">
					<div class="thumb__container">
						<div class="thumb__wrap">
							<div class="thumb__slider-block">
								<div class="thumb__slider slider-thumb">
									<div class="slider-thumb__swiper">
										<div class="slider-thumb__slide">
											<div class="slider-thumb__image-block">
												<div class="slider-thumb__image">
													<img src="./img/people/01.jpg" alt="">
												</div>
											</div>	
										</div>
										<div class="slider-thumb__slide">
											<div class="slider-thumb__image-block">
												<div class="slider-thumb__image">
													<img src="./img/main/01.jpg" alt="">
												</div>
												<div class="slider-thumb__image-abs">
													<img src="./img/main/main.png" alt="">
												</div>
											</div>	
										</div>
										<div class="slider-thumb__slide">
											<div class="slider-thumb__image-block">
												<div class="slider-thumb__image">
													<img src="./img/people/01.jpg" alt="">
												</div>
											</div>	
										</div>

									</div>
								</div>
							</div>
							<div class="thumb__content">
								<div class="thumb__logo">
									<img src="img/logo.svg" alt="">
								</div>
								<p class="thumb__text">Стань первым и оставь заявку на квартиру в Жилом Комплексе "Феномен"</p>
								<div class="thumb__form">
									<form action="" class="thumb__body">
										<div class="thumb__input-body">
											<label for="" class="thumb__label">Ваше имя</label>
											<input type="text" placeholder="Александр" class="thumb__input">
										</div>
										<div class="thumb__input-body">
											<label for="" class="thumb__label">Номер телефона</label>
											<input type="tel" data-format="+7 000 000-00-00" placeholder="+7" class="thumb__input">
										</div>
										<div class="thumb__input-body">
											<label for="" class="thumb__label">Номер желательного дома</label>
											<input type="text" placeholder="5 дом" class="thumb__input">
										</div>
										<div class="thumb__checkbox checkbox">
											<input id="t_1" type="checkbox" value="1" class="checkbox__input">
											<label for="t_1" class="checkbox__label"><span class="checkbox__text text-small">Нажимая кнопку «Забронировать» вы соглашаетесь с нашей <a href="" target="_blank" class="checkbox__link">политикой конфиденциальности</a></span></label>
										</div>
										<button type="submit" class="thumb__button button-main"><span>Забронировать</span></button>	
									</form>							
									<a href="" target="_blank" class="thumb__button button-tr-white"><span>Скачать полную презентацию</span></a>
								</div>
							</div>
						</div>
					</div>
				</section>
			</main>	
		</div>
<script src="js/jquery.min.js"></script>
<script src="js/ScrollTrigger.min.js"></script>
<script src="js/gsap.min.js"></script>
<script src="js/imask.js"></script>
<script src="js/fancybox.umd.js"></script>
<script src="js/swiper-bundle.min.js"></script>
<script src="js/main.js"></script>		</body>
</html>
