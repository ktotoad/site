<!DOCTYPE html>
<html>

<head>
  <title>Настройки тестирования</title>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport"/>
  <meta content="VS BookEditor" name="GENERATOR"/>
  <meta content="" name="keywords"/>
  <meta content="" name="description"/>
  <meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
  <meta content="no-cache" http-equiv="Pragma"/>
  <meta content="0" http-equiv="Expires"/>
  <!-- Стили CSS BEGIN -->
  <link href="../css/bootstrap.min.css" rel="stylesheet"/>
  <link href="../css/service.css" rel="stylesheet"/>
  <style>
   select {
    width: 100px;
   }
  </style>
  <!-- Стили CSS END -->
</head>

<body onload="onWindowLoadTestStart()" onunload="onWindowUnload()">
  <div class="container-fluid">
    <!-- Панель инструментов BEGIN -->
    <div class="row mb-sm-3 bg-light my-serach-box">
      <!-- Ночной режим BEGIN -->
      <div class="col-sm-3">
        <div class="form-check" id="night_mode">
          <input class="form-check-input" id="night_mode_id" onclick="setNightMode()" title="Включите, чтобы читать в темноте" type="checkbox"/>
          <label class="form-check-label" for="night_mode_id" title="Включите, чтобы читать в темноте">Ночной режим</label>
        </div>
      </div>
      <!-- Ночной режим END -->
      <div class="col-sm-9 text-right">
        <button class="btn" onclick="showPPS('{{JSppslink}}')" style="margin:0;padding:0;" type="button"><img src="../img/consult.png" title="Записаться на консультацию" width="30"/></button>
        <button class="btn" style="margin:0;padding:0;" type="button" onclick="showHelp()"><img src="../img/help.png" width=30 title="Справка"></button>
      </div>
    </div>
    <div class="row mb-sm-3">
      <div class="col-sm-12">
        <h1>Настройки теста</h1>
      </div>
    </div>
    <div class="row mb-sm-3">
      <div class="col-sm-12">
        <table class="table table-striped table-bordered disable_no_night">
          <tbody>
            <tr>
              <th scope="row">Имя теста</th>
              <td><div id="testName"></td>
            </tr>
            <tr>
              <th scope="row">Выберите сложность</th>
              <td>
                <div>
                  <div class="dropdown">
                    <button aria-expanded="false" aria-haspopup="true" class="btn dropdown-toggle" data-toggle="dropdown" id="difficulty_menu_id" title="Нажмите, чтобы изменить уровень сложности" type="button">
                      Сложность
                    </button>
                    <div aria-labelledby="difficulty_menu_id" class="dropdown-menu">
                      <button class="dropdown-item" onclick="onTestDifficultyChange(3)" type="button">Достаточная</button>
                      <button class="dropdown-item" onclick="onTestDifficultyChange(4)" type="button">Повышенная</button>
                      <button class="dropdown-item" onclick="onTestDifficultyChange(5)" type="button">Высокая</button>
                    </div>
                  </div>
                </div>
              </td>
            </tr>
            <tr>
              <th scope="row"></th>
              <td><button class="btn btn-outline-primary" id="btnGotoTheory" onclick="gotoTheory()" type="button">Вернуться к теории</button></td>
            </tr>
            <tr>
              <th scope="row"></th>
              <td><button class="btn btn-outline-primary" id="startTest" onclick="onStartTest()" type="button">Начать тестирование</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  <!-- Скрипты BEGIN -->
  <script src="../js/jquery.min.js"></script>
  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/constants.js"></script>
  <script src="../js/senddata.js"></script>
  <script src="../js/service.js"></script>
  <script src="../js/testres.service.js"></script>
  <script>
    // Запрет отладки
    loadModule({{JSNoDebug}}, '../js/nodebug_tools.js');
	
    var PPSLINK = "{{JSppslink}}";
    var testId = localStorage_getItem(currentTestId);
    var tests = getTests();
    var test = tests[testId];
    var testName = document.getElementById("testName");
    if (testName) testName.innerText = test.title;
    var qQuant = localStorage_getItem(questionQuantityStr);
    var level = 3; // уровень сложности
    isPreview = {{isPreview}};
    onTestDifficultyChange(level); // инициализация надписи на кнопке
    updateGotoTheoryButton(); // Обновление состояния кнопки перехода к теории

    function onStartTest(event) {
      if (!canStartTest(testId)) {
        return;
      }
      getQuestionsArrayWithLevel(test, level);
      let len = test.questions.length;
      if (len == 0) {
        showMessage("В тесте нет вопросов с указанной сложностью, повысьте уровень сложности");
      } else 
      if (len < qQuant) {
        showMessage("В тесте недостаточно вопросов, повысьте уровень сложности");
      } else {
        goToFirstQuestion(testId, level);
      }
    }

    function onTestDifficultyChange(diff) {
      var elem=document.getElementById("difficulty_menu_id");
      if (elem) {
        elem.innerHTML = "Сложность: " + diffNameByLevel(diff);
      }
      level = diff;
    }
  </script>
  <!-- Скрипты END -->
</body>
</html>
