<!DOCTYPE html>
<html lang="ru">
	<head>
		<title>Формы</title>
		<meta charset="utf-8">
		<meta name="format-detection" content="telephone=no">
		<link rel="icon" href="/favicon.ico" type="image/x-icon">
		<link rel="stylesheet" href="css/nouislider.css" />
		<link rel="stylesheet" href="css/jquery-ui.css" />
		<link rel="stylesheet" href="css/style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
		<!-- прячем от поисковиков -->
		<meta name="robots" content="noindex, nofollow" />
	</head>
	<body>
		<div class="wrapper">

			<main class="page">
				<section class="page__main main">
					<div class="main__container container">
						<div class="main__wrap">
							<form action="" class="form">
								<!-- toggle -->
								<div class="form__toggle toggle">
									<div data-toggle-id="item" class="toggle__button"><span></span></div>
									<div class="toggle__icon">
										<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
											<path fill="currentColor" fill-rule="evenodd" d="M9.335 9.518h-.002v1.183H6.667v-.972c0-1.762.685-2.092 1.445-2.46l.18-.084c.335-.154.675-.311.97-.656 1.106-1.085.271-2.8-1.128-2.79a1.66 1.66 0 0 0-1.796 1.652l-2.671-.006A4.37 4.37 0 0 1 6.04 1.53a4.33 4.33 0 0 1 2.307-.454c2.216.179 4.034 2.075 4.052 4.32.015 1.827-1.378 3.576-3.065 4.122Zm-2.668 5.149H8.4a.933.933 0 0 0 .933-.934V12H7.6a.933.933 0 0 0-.933.933z" clip-rule="evenodd"></path>
										</svg>
									</div>
									<p class="toggle__text text-m">Открыть отели в новой вкладке</p>
								</div>

								<!-- passengers -->
								<div data-tabs drop-block class="form__block">
									<div class="form__input-block">
										<div class="form__input-body">
											<label data-select-button for="passengers" class="form__label">Пассажиры</label>
											<div class="form__input-row">
												<div class="form__chosen-text">
													<div id="counted"><span>1</span><span> пасс,</span></div> 
													<div data-tabs-body id="classtype" class="tabs__content">
														<div data-tabs-item  class="tabs__body">эконом</div>
														<div data-tabs-item  class="tabs__body">бизнес</div>
														<div data-tabs-item  class="tabs__body">первый</div>
													</div>
												</div>
											</div>
										</div>
										<div class="form__input-icon"><span></span></div>
									</div>
									<div class="form__drop-body drop-body">
										<div class="drop-body__list">
											<div class="drop-body__item">
												<div class="form__item-label">
													<div class="form__item-title">Взрослые</div>
													<div class="form__item-info">старше 12 лет</div>
												</div>
												<div class="form__counter counter-block" data-id="total-adults" data-counter="1">
													<button type="button" class="counter-block__button decrease">-</button>
													<div class="counter-block__text value"></div>
													<button type="button" class="counter-block__button increase">+</button>
												</div>
											</div>
											<div class="drop-body__item">
												<div class="form__item-label">
													<div class="form__item-title">Дети</div>
													<div class="form__item-info">от 2 до 12 лет</div>
												</div>
												<div class="form__counter counter-block" data-counter="0">
													<button type="button" class="counter-block__button decrease">-</button>
													<div class="counter-block__text value"></div>
													<button type="button" class="counter-block__button increase">+</button>
												</div>
											</div>
											<div class="drop-body__item">
												<div class="form__item-label">
													<div class="form__item-title">Младенцы</div>
													<div class="form__item-info">до 2 лет, без места</div>
												</div>
												<div class="form__counter counter-block" data-max-source="total-adults" data-counter="0">
													<button type="button" class="counter-block__button decrease">-</button>
													<div class="counter-block__text value"></div>
													<button type="button" class="counter-block__button increase">+</button>
												</div>
											</div>
										</div>
										<div radio-buttons class="drop-body__tabs">
											<nav data-tabs-titles class="drop-body__tabs-navigation">
												<div data-tabs-title class="drop-body__tabs-button _tab-active">Эконом</div>
												<div data-tabs-title class="drop-body__tabs-button">Бизнес</div>
												<div data-tabs-title class="drop-body__tabs-button">Первый</div>
											</nav>
										</div>
									</div>
								</div>

								<!-- destination -->
								<div drop-block class="form__block">
									<div class="form__input-block">
										<div class="form__input-body">
											<label class="form__label">Откуда</label>
											<div class="form__input-row">
												<input type="text" name="from" placeholder="Москва" class="form__input input">
											</div>
										</div>
										<div class="form__input-info">MOW</div>
									</div>
									<div class="form__drop-body drop-body">
										<h3 class="drop-body__title">Города и аэропорты</h3>
										<ul class="drop-body__list">
											<li></li>
										</ul>
									</div>
								</div>

								<!-- date -->
								<div class="form__block-row">
									<div class="form__block">
										<div class="form__input-block">
											<div class="form__input-body">
												<label class="form__label">Туда</label>
												<div class="form__input-row">
													<input type="text" id="datefrom" name="from" class="form__input input">
												</div>
											</div>
											<div class="form__input-icon"></div>
										</div>
									</div>
									<div class="form__block">
										<div class="form__input-block">
											<div class="form__input-body">
												<label class="form__label">Обратно</label>
												<div class="form__input-row">
													<input type="text" id="dateto" name="from" class="form__input input">
												</div>
											</div>
											<div class="form__input-icon"></div>
										</div>
									</div>
								</div>

								<!-- regular inputs -->
								<div class="form__block">
									<div class="form__input-block err">
										<div class="form__input-body">
											<label class="form__label">Форма с ошибкой</label>
											<div class="form__input-row">
												<input type="text" name="name" placeholder="Форма с ошибкой" class="form__input input">
											</div>
										</div>
									</div>
								</div>	

								<div class="form__block">
									<div class="form__input-block disabled">
										<div class="form__input-body">
											<label class="form__label">Форма отключена</label>
											<div class="form__input-row">
												<input type="text" name="name" disabled placeholder="Форма отключена" class="form__input input">
											</div>
										</div>
									</div>
								</div>	

								<div class="form__block">
									<div class="form__input-block">
										<div class="form__input-body">
											<label class="form__label">Имя</label>
											<div class="form__input-row">
												<input type="text" name="name" placeholder="Ваше имя" class="form__input input">
											</div>
										</div>
									</div>
								</div>	

								<div class="form__block">
									<div class="form__input-block">
										<div class="form__input-body">
											<label class="form__label">Почта</label>
											<div class="form__input-row">
												<input type="email" name="email" placeholder="example@mail.ru" class="form__input input">
											</div>
										</div>
									</div>
								</div>

								<div class="form__block">
									<div class="form__input-block">
										<div class="form__input-body">
											<label class="form__label">Телефон</label>
											<div class="form__input-row">
												<input type="tel" name="tel" data-format="+7 000 000-00-00" placeholder="+7" class="form__input input">
											</div>
										</div>
									</div>
								</div>

								<button class="button-main">Отправить</button>
							</form>
						</div>
					</div>
				</section>

			</main>

		</div>

<script src="js/jquery.min.js"></script>
<script src="js/imask.js"></script>
<script src="js/jquery-ui.js"></script>
<script src="js/nouislider.min.js"></script>
<script src="js/main.js"></script>
	</body>
</html>
