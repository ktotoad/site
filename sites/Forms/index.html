<!DOCTYPE html>
<html lang="ru">
	<head>
		<title>Формы</title>
		<meta charset="utf-8">
		<meta name="format-detection" content="telephone=no">
		<link rel="icon" href="/favicon.ico" type="image/x-icon">
		<link rel="stylesheet" href="css/nouislider.css" />
		<link rel="stylesheet" href="css/style.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
		<!-- прячем от поисковиков -->
		<meta name="robots" content="noindex, nofollow" />
	</head>
	<body>
		<div class="wrapper">

			<main class="page">
				<section class="page__main main">
					<div class="main__container container">
						<div class="main__wrap">

							<!-- passengers -->
							<div drop-block class="form__block">
								<div class="form__input-block">
									<div class="form__input-body">
										<label data-select-button for="passengers" class="form__label">Пассажиры</label>
										<div class="form__input-row">
											<div class="form__chosen-text">
												<span id="counted">3</span> пасс, <span id="classtype">эконом</span>
											</div>
										</div>
									</div>
									<div class="form__input-icon"><span></span></div>
								</div>
								<div class="form__drop-body">
									<div class="form__list">
										<div class="form__item">
											<div class="form__item-label">
												<div class="form__item-title">Взрослые</div>
												<div class="form__item-info">старше 12 лет</div>
											</div>
											<div class="form__counter counter-block" data-id="total-adults" data-counter="1">
												<button type="button" class="counter-block__button decrease">-</button>
												<div class="counter-block__text value"></div>
												<button type="button" class="counter-block__button increase">+</button>
											</div>
										</div>
										<div class="form__item">
											<div class="form__item-label">
												<div class="form__item-title">Дети</div>
												<div class="form__item-info">от 2 до 12 лет</div>
											</div>
											<div class="form__counter counter-block" data-counter="0">
												<button type="button" class="counter-block__button decrease">-</button>
												<div class="counter-block__text value"></div>
												<button type="button" class="counter-block__button increase">+</button>
											</div>
										</div>
										<div class="form__item">
											<div class="form__item-label">
												<div class="form__item-title">Младенцы</div>
												<div class="form__item-info">до 2 лет, без места</div>
											</div>
											<div class="form__counter counter-block" data-max-source="total-adults" data-counter="0">
												<button type="button" class="counter-block__button decrease">-</button>
												<div class="counter-block__text value"></div>
												<button type="button" class="counter-block__button increase">+</button>
											</div>
										</div>
									</div>
									<div radio-buttons class="form__checkboxes">
										<div class="form__checkbox radio">
											<input id="c_1" name="classtype" type="radio" value="1">
											<label for="c_1">Эконом</label>
										</div>
										<div class="form__checkbox radio">
											<input id="c_2" name="classtype" type="radio" value="2">
											<label for="c_2">Бизнес</label>
										</div>
										<div class="form__checkbox radio">
											<input id="c_3" name="classtype" type="radio" value="3">
											<label for="c_3">Первый</label>
										</div>
									</div>
								</div>
							</div>

							<!-- destination -->
							<div class="form__block">
								<div class="form__input-block">
									<div class="form__input-body">
										<label for="from" class="form__label">Откуда</label>
										<div class="form__input-row">
											<input type="text" name="from" placeholder="Москва" class="form__input input">
										</div>
									</div>
									<div class="form__input-info">MOW</div>
								</div>
							</div>

							<!-- date -->
							<div class="form__block">

							</div>

						</div>
					</div>
				</section>

			</main>

		</div>

<script src="js/imask.js"></script>
<script src="js/nouislider.min.js"></script>
<script src="js/main.js"></script>
	</body>
</html>
